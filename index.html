<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="sound"></audio>
    <div class="container">
        <h1>English Dictionary</h1>
        <div class="search-box">
            <input type="text" placeholder="Search for a word..." id="input-word" autocomplete="off" />
            <button id="search-btn">Search</button>
        </div>
        <div class="result" id="result"></div>
    </div>

    <div class="watermark-container">
        <div class="watermark">&copy; 2025 Developed by Arnava Kumar Sinha</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
